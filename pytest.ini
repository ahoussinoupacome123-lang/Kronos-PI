[pytest]
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    default
    # Corpus de test minuscule et volontairement répétitif : SVD et KMeans
    # signalent des points dupliqués, ce qui est attendu ici.
    ignore:invalid value encountered in divide:RuntimeWarning
    ignore:Number of distinct clusters:UserWarning
